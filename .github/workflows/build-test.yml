name: build-test

on:
  push:
  pull_request:

jobs:
  windows-x64-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine64

      - name: Build and run tests
        run: |
          make test

      - name: Build Windows 64-bit exe
        run: |
          make app

      - name: Upload app.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-app
          path: build/app.exe
          if-no-files-found: error
