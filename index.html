<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px;
      color: #f8fafc; background: radial-gradient(ellipse at top, #26354d, #101827 70%);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .calculator {
      width: min(100%, 360px); padding: 22px; border: 1px solid #ffffff20;
      border-radius: 24px; background: #182335; box-shadow: 0 24px 60px #0006;
    }
    h1 { margin: 0 0 18px; color: #cbd5e1; font-size: 1rem; font-weight: 500; text-align: center; }
    .display {
      min-height: 100px; display: flex; align-items: end; justify-content: flex-end;
      overflow: hidden; margin-bottom: 18px; padding: 16px; border-radius: 16px;
      background: #0c1421; color: #fff; font-size: clamp(2rem, 10vw, 3rem);
      direction: ltr; text-overflow: ellipsis; white-space: nowrap;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      min-height: 62px; border: 0; border-radius: 14px; background: #29374c; color: #f8fafc;
      font: inherit; font-size: 1.25rem; cursor: pointer; transition: transform 120ms, filter 120ms;
    }
    button:hover { filter: brightness(1.2); }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .utility { background: #3a4960; }
    .operator { background: #2563eb; }
    .equals { background: #16a34a; }
    .zero { grid-column: span 2; }
    @media (max-width: 380px) { .calculator { padding: 16px; } .keys { gap: 8px; } }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <output class="display" id="display" aria-live="polite">0</output>
    <div class="keys">
      <button class="utility" data-action="clear" aria-label="Clear">C</button>
      <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="operator" data-action="operator" data-value="/" aria-label="Divide">/</button>
      <button class="operator" data-action="operator" data-value="*" aria-label="Multiply">*</button>
      <button data-action="digit" data-value="7">7</button>
      <button data-action="digit" data-value="8">8</button>
      <button data-action="digit" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="-" aria-label="Subtract">-</button>
      <button data-action="digit" data-value="4">4</button>
      <button data-action="digit" data-value="5">5</button>
      <button data-action="digit" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="+" aria-label="Add">+</button>
      <button data-action="digit" data-value="1">1</button>
      <button data-action="digit" data-value="2">2</button>
      <button data-action="digit" data-value="3">3</button>
      <button class="zero" data-action="digit" data-value="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>
  <script>
    const display = document.querySelector("#display");
    let current = "0", stored = null, operation = null, startNewNumber = false;

    function updateDisplay() { display.textContent = current; }
    function enterDigit(digit) {
      if (current === "Error") current = "0";
      if (startNewNumber || current === "0") { current = digit; startNewNumber = false; }
      else if (current.length < 14) current += digit;
      updateDisplay();
    }
    function formatResult(value) {
      if (!Number.isFinite(value)) return "Error";
      return String(Number(value.toPrecision(12)));
    }
    async function calculate(a, b, op) {
      const response = await fetch("/calculate", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ a, b, op })
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || "Calculation failed");
      return data.result;
    }
    async function chooseOperation(nextOperation) {
      if (current === "Error") return;
      const value = Number(current);
      if (operation && !startNewNumber) {
        try { current = formatResult(await calculate(stored, value, operation)); }
        catch { current = "Error"; }
        updateDisplay();
      } else current = formatResult(value);
      if (current === "Error") { stored = null; operation = null; return; }
      stored = Number(current); operation = nextOperation; startNewNumber = true;
    }
    async function equals() {
      if (!operation || stored === null || current === "Error") return;
      try { current = formatResult(await calculate(stored, Number(current), operation)); }
      catch { current = "Error"; }
      stored = null; operation = null; startNewNumber = true; updateDisplay();
    }
    function handleAction(action, value) {
      if (action === "digit") enterDigit(value);
      else if (action === "decimal" && current !== "Error") {
        if (startNewNumber) { current = "0."; startNewNumber = false; }
        else if (!current.includes(".")) current += ".";
        updateDisplay();
      } else if (action === "operator") chooseOperation(value);
      else if (action === "equals") equals();
      else if (action === "clear") {
        current = "0"; stored = null; operation = null; startNewNumber = false; updateDisplay();
      } else if (action === "delete" && !startNewNumber && current !== "Error") {
        current = current.length > 1 ? current.slice(0, -1) : "0"; updateDisplay();
      }
    }
    document.querySelector(".keys").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (button) handleAction(button.dataset.action, button.dataset.value);
    });
    document.addEventListener("keydown", event => {
      if (/^\d$/.test(event.key)) handleAction("digit", event.key);
      else if (event.key === ".") handleAction("decimal");
      else if (event.key === "Enter" || event.key === "=") handleAction("equals");
      else if (event.key === "Backspace") handleAction("delete");
      else if (event.key === "Escape") handleAction("clear");
      else if (["+", "-", "*", "/"].includes(event.key)) handleAction("operator", event.key);
    });
  </script>
</body>
</html>
